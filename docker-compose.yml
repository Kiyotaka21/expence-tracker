services:
  postgres:
    image: postgres:17-alpine
    container_name: expence-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expence}
      POSTGRES_DB: ${POSTGRES_DB:-expence_tracker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-expence} -d ${POSTGRES_DB:-expence_tracker}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
